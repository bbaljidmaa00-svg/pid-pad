<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PID PAD • After Hours</title><style>
*{box-sizing:border-box}body{margin:0;background:#18120e;color:#f4e4cd;font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #a97b50;background:#39291e;border-radius:10px;padding:12px}button:disabled{opacity:.4}input{background:#201812;color:white;border:1px solid #846445;border-radius:9px;padding:12px;min-width:0}main{max-width:760px;margin:auto;padding:16px}header,footer,.panel{background:#211a15e8;border:1px solid #65503e;border-radius:16px;padding:14px}header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:8px;z-index:5}h1{font:italic 46px Georgia;margin:12px 0}small{color:#d6ae86}.accent{background:#b46c36;color:white}.table{position:relative;isolation:isolate;min-height:390px;margin:16px 0;padding:24px 14px;border-radius:45% 45% 12% 12% / 12% 12% 8% 8%;background:repeating-linear-gradient(4deg,#ffffff08 0 2px,transparent 2px 18px),radial-gradient(ellipse at 40% 35%,#ac7546,#674020 70%,#382416);box-shadow:inset 0 0 45px #29170c,0 20px 35px #0009}.candle{position:absolute;top:15%;right:9%;width:22px;height:35px;background:#d5ae74;border-radius:4px;box-shadow:0 0 55px 22px #ffb64b55}.candle:before{content:"";position:absolute;left:7px;top:-20px;width:9px;height:23px;background:#fff0ae;border-radius:80% 20% 70% 30%;box-shadow:0 0 20px 6px #ffb448;animation:flicker .8s infinite alternate}@keyframes flicker{to{transform:rotate(8deg) scale(.8);opacity:.8}}.players,.options{display:flex;gap:12px;overflow-x:auto;padding:10px 4px;align-items:center}.polaroid{flex:0 0 90px;background:#f1e5ce;color:#34271d;padding:7px 7px 12px;border-radius:3px;box-shadow:2px 5px 9px #0006;transform:rotate(-4deg);text-align:center;font-weight:800;overflow-wrap:anywhere}.polaroid:nth-child(even){transform:rotate(4deg)}.polaroid img,.avatar{width:100%;aspect-ratio:1;object-fit:cover;background:#a98b6b;display:grid;place-items:center;font-size:32px}.selected{outline:3px solid #ffb76e}.deck{position:relative;margin:38px auto 30px;width:85%;max-width:370px;min-height:160px;display:grid;place-items:center}.deck:before,.deck:after{content:"";position:absolute;inset:0;background:#8c3835;border:5px solid #e4cba5;border-radius:13px;transform:rotate(-12deg);z-index:-1}.deck:after{background:#385c69;transform:rotate(11deg)}.card{background:#f4e7cb;color:#33261d;border:7px double #ad8259;border-radius:12px;padding:24px;text-align:center;width:100%;box-shadow:0 8px 20px #0005}.flip{animation:flip .45s ease-out}@keyframes flip{from{transform:translateY(-35px) rotateY(85deg);opacity:.2}to{transform:none;opacity:1}}.chat{max-height:160px;overflow:auto}.bubble{background:#30251c;border-radius:15px;padding:7px 12px;margin:5px 0;overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1}.center{text-align:center}.hidden{display:none}.entry{display:grid;gap:12px;margin:25px auto;max-width:430px}.entry label{display:block}.entry input{width:100%}#portrait{width:90px;margin:auto}.error{color:#ff9d87;min-height:24px}#clock{color:#ffab66;font:24px monospace}.score{padding:8px}button.polaroid{border:0}footer{margin-top:12px}.reactions button{padding:6px 12px}
</style><main><header><b style="color:#e58b63">● PID PAD</b><small id="roomLabel">AFTER HOURS</small><span id="clock">00:00</span></header><section id="entry" class="entry"><div class="center"><h1>After Hours</h1><p>Шөнө дөнгөж эхэлж байна.</p></div><div id="portrait" class="polaroid"><div class="avatar">📷</div></div><label>Өөрийн зураг<input id="photo" type="file" accept="image/*"></label><input id="name" maxlength="24" placeholder="Чиний нэр"><button id="create" class="accent">Өрөө үүсгэх</button><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 оронтой код"><button id="join">Нэгдэх</button></div><a href="/" style="color:#d6ae86">Хуучин PID PAD</a></section><section id="game" class="hidden"><div class="row"><small id="status"></small><button id="invite">Код хуулах</button><button id="leave">Гарах</button></div><div class="table"><div class="candle"></div><div class="players" id="players"></div><div class="deck"><div class="card" id="card"><small>AFTER HOURS</small><h2>Найзуудаа хүлээж байна</h2></div></div><div id="result" class="center"></div></div><div id="voteTitle" class="center"></div><div class="options" id="options"></div><div class="row" id="host"></div><footer><div class="chat" id="chat"></div><form id="chatForm" class="row"><input id="message" maxlength="240" placeholder="Чат бичих..."><button>Илгээх</button></form><div class="row reactions" id="reactions"></div><details><summary>Оноо</summary><div id="scores"></div></details></footer></section><p class="error" id="error" role="alert"></p></main><script>
const $=id=>document.getElementById(id), el=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};let room=null,token='',code='',photo='',busy=false,lastCard='',lastChat='',lastPlayers='',lastOptions='',lastHost='',lastScores='',lastResult='';
const prompts=['Шөнө дунд хуучин хайр руугаа залгах магадлалтай нь хэн бэ?','Хамгийн гэнэтийн аялал зохиох хүн?','Найзуудынхаа төрсөн өдрийг мартах хүн?','Нууц авьяастай байх магадлалтай нь?','Хамгийн хөгжилтэй шалтаг зохиох хүн?','Киноны гол дүр болох хүн?','Хамгийн удаан бэлдэх хүн?','Танихгүй хүнтэй шууд найзлах хүн?','Хамгийн инээдтэй дурсамж бүтээх хүн?','Бүгдийг дахин уулзуулах хүн?'];
const choices=[['Өнгөрсөн рүү аялах уу, ирээдүй рүү аялах уу?','Өнгөрсөн','Ирээдүй'],['Нэг сар хөгжимгүй эсвэл сошиалгүй?','Хөгжимгүй','Сошиалгүй'],['Гэнэтийн аялал уу, гэртээ кино үзэх үү?','Аялал','Кино']];
function err(e){$('error').textContent=e.message||String(e)}async function api(path,data){let res=await fetch('/api/rooms/'+path,{method:data?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});let j=await res.json();if(!res.ok)throw Error(j.error||'Холболтын алдаа');return j}
function portrait(p,click,selected){let b=el(click?'button':'div',null,'polaroid'+(selected?' selected':''));if(p.photo){let i=el('img');i.src=p.photo;i.alt='';b.append(i)}else b.append(el('div',p.name.slice(0,1).toUpperCase(),'avatar'));b.append(el('div',p.name));if(click)b.onclick=click;return b}
$('photo').onchange=async()=>{try{let f=$('photo').files[0];if(!f)return;let i=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=128;let s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);photo=c.toDataURL('image/jpeg',.75);i.close();$('portrait').replaceChildren(portrait({name:'Чи',photo}));}catch(e){err(e)}};
async function enter(create){if(busy)return;busy=true;try{let name=$('name').value.trim();if(!name)throw Error('Нэрээ бичээрэй');let j=await api(create?'create':$('code').value+'/join',{name,photo});token=j.token;code=j.room.code;sessionStorage.setItem('afterHours',JSON.stringify({token,code}));render(j.room)}catch(e){err(e)}finally{busy=false}}
$('create').onclick=()=>enter(true);$('join').onclick=()=>enter(false);$('leave').onclick=()=>{sessionStorage.removeItem('afterHours');location.reload()};$('invite').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('invite').textContent='Хууллаа'}catch(e){err(e)}};
async function act(d){if(busy)return;busy=true;try{let j=await api(code+'/action',d);render(j.room);$('error').textContent=''}catch(e){err(e)}finally{busy=false}}
function btn(label,fn){let b=el('button',label);b.onclick=fn;return b}
function next(mode){let n=room.round;if(mode==='choice'){let a=choices[n%choices.length];act({type:'next',mode,prompt:a[0],options:[{id:'a',label:a[1]},{id:'b',label:a[2]}]})}else act({type:'next',mode:'who',prompt:prompts[n%prompts.length]})}
function render(r){room=r;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roomLabel').textContent='ROOM '+r.code;$('status').textContent=r.players.length+' тоглогч · '+r.round+'/10';let key=JSON.stringify(r.players);if(key!==lastPlayers){lastPlayers=key;$('players').replaceChildren(...r.players.map(p=>portrait(p)))}key=JSON.stringify(r.card);if(key!==lastCard){lastCard=key;$('card').replaceChildren(el('small','PID PAD • AFTER HOURS'),el('h2',r.card?.prompt||'Найзуудаа хүлээж байна'));$('card').classList.remove('flip');void $('card').offsetWidth;$('card').classList.add('flip')}
key=JSON.stringify([r.card,r.phase,r.myVote,r.players]);if(key!==lastOptions){lastOptions=key;$('options').replaceChildren();if(r.phase==='voting')for(let o of r.card.options){let p=r.players.find(p=>p.id===o.id);let b=p?portrait(p,()=>act({type:'vote',optionId:o.id}),r.myVote===o.id):btn(o.label,()=>act({type:'vote',optionId:o.id}));if(r.myVote===o.id)b.classList.add('selected');$('options').append(b)}}$('voteTitle').textContent=r.phase==='voting'?(r.myVote?'Санал өгсөн · ':'Саналаа өг! · ')+r.ballotsCount+'/'+r.players.length:r.phase==='results'?'Үр дүн':'';
key=JSON.stringify([r.phase,r.ballots,r.card]);if(key!==lastResult){lastResult=key;$('result').replaceChildren();if(r.phase==='results')for(let o of r.card.options){let count=Object.values(r.ballots).filter(v=>v===o.id).length;$('result').append(el('div',o.label+' — '+count+' санал'))}}
key=JSON.stringify([r.isHost,r.phase,r.gameFinished]);if(key!==lastHost){lastHost=key;$('host').replaceChildren();if(r.isHost){if(r.phase==='voting')$('host').append(btn('Үр дүн нээх',()=>act({type:'reveal'})));else if(r.gameFinished)$('host').append(btn('Дахин тоглох',()=>act({type:'reset'})));else $('host').append(btn('Хэн хамгийн... →',()=>next('who')),btn('Аль нь дээр вэ? →',()=>next('choice')))}}
key=JSON.stringify(r.messages);if(key!==lastChat){lastChat=key;$('chat').replaceChildren(...(r.messages||[]).map(m=>el('div',(r.players.find(p=>p.id===m.playerId)?.name||'?')+': '+m.text,'bubble')));$('chat').scrollTop=$('chat').scrollHeight}
key=JSON.stringify(r.scores);if(key!==lastScores){lastScores=key;$('scores').replaceChildren(...r.players.slice().sort((a,b)=>(r.scores[b.id]||0)-(r.scores[a.id]||0)).map(p=>el('div',p.name+' · '+(r.scores[p.id]||0),'score')))}}
$('chatForm').onsubmit=e=>{e.preventDefault();let text=$('message').value.trim();if(text&&!busy){$('message').value='';act({type:'chat',text})}};for(let emoji of ['😂','👀','🔥','❤️','😭'])$('reactions').append(btn(emoji,()=>act({type:'reaction',text:emoji})));
setInterval(async()=>{if(!token||busy)return;busy=true;try{render((await api(code)).room)}catch(e){err(e)}finally{busy=false}},1800);setInterval(()=>{$('clock').textContent=room?.phase==='voting'&&room.deadline?String(Math.max(0,Math.ceil((room.deadline-Date.now())/1000))).padStart(2,'0')+'s':new Date().toLocaleTimeString('mn-MN',{hour:'2-digit',minute:'2-digit'});},250);
try{let s=JSON.parse(sessionStorage.getItem('afterHours'));if(s){token=s.token;code=s.code;api(code).then(j=>render(j.room)).catch(e=>{token='';sessionStorage.removeItem('afterHours');err(e)})}}catch(e){}
</script></html>
